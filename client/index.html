<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#00666B" />
    <link rel="manifest" href="/manifest.json?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/lahza-icon-192.png?v=3" />
    <link rel="apple-touch-icon" sizes="192x192" href="/assets/icons/lahza-icon-192.png?v=3" />
    <title>تطبيق لحظة | Lahza</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      (() => {
        const remoteAppUrl = "https://lahza-production-e0af.up.railway.app/?lahza_remote=1";
        const isNativeShell = Boolean(window.Capacitor?.isNativePlatform?.()) || window.location.protocol === "capacitor:";
        const isRemoteBoot = new URLSearchParams(window.location.search).has("lahza_remote");
        if (!isNativeShell || isRemoteBoot || window.location.search.includes("local=1")) return;
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 4500);
        fetch(remoteAppUrl, { method: "HEAD", cache: "no-store", mode: "no-cors", signal: controller.signal })
          .then(() => { window.location.replace(remoteAppUrl); })
          .catch(() => { /* Keep the bundled local interface when offline. */ })
          .finally(() => window.clearTimeout(timeout));
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

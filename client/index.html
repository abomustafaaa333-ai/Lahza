<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#6F1028" />
    <title>تطبيق لحظة | Lahza</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div id="instant-home-shell" dir="rtl" aria-label="واجهة لحظة" style="min-height:100dvh;background:#fff8f1;color:#4a2618;font-family:Cairo,Arial,sans-serif;">
        <div style="padding:18px 16px 0;">
          <div style="height:44px;display:flex;align-items:center;justify-content:space-between;">
            <strong style="font-size:24px;font-weight:900;color:#63301b;">لحظة</strong>
            <span style="display:inline-flex;align-items:center;border-radius:14px;background:#fff;color:#63301b;padding:10px 14px;font-size:13px;font-weight:800;box-shadow:0 4px 18px rgba(99,48,27,.08);">سلة الطلبات</span>
          </div>
          <div style="margin-top:14px;min-height:150px;border-radius:24px;background:linear-gradient(135deg,#159da5,#087d87);padding:24px 20px;color:#fff;box-sizing:border-box;">
            <small style="display:block;font-size:13px;font-weight:800;opacity:.9;">خدمات لحظة</small>
            <strong style="display:block;margin-top:10px;font-size:27px;line-height:1.35;">كل احتياجاتك في لحظة</strong>
            <span style="display:block;margin-top:6px;font-size:14px;opacity:.9;">مطاعم، بقاليات وخدمات قريبة منك</span>
          </div>
          <div style="height:12px;width:42%;margin:22px auto 0;border-radius:999px;background:#f0ddd0;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

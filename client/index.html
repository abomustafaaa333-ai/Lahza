<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#00666B" />
    <link rel="manifest" href="/manifest.json?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/lahza-icon-192.png?v=4" />
    <link rel="apple-touch-icon" sizes="192x192" href="/assets/icons/lahza-icon-192.png?v=4" />
    <title>تطبيق لحظة | Lahza</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" /></noscript>
    <style>
      #root:has(.boot-splash) { min-height: 100svh; }
      .boot-splash { min-height: 100svh; display: grid; place-content: center; justify-items: center; gap: 1rem; padding: 2rem; color: #fff; background: linear-gradient(145deg, #005f64, #08777a); font-family: Arial, sans-serif; text-align: center; }
      .boot-splash strong { font-size: 2rem; letter-spacing: -.08em; }
      .boot-splash span { font-size: .9rem; font-weight: 700; opacity: .9; }
      .boot-splash i { width: 2rem; height: 2rem; border: 3px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: lahza-boot-spin .8s linear infinite; }
      @keyframes lahza-boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-splash" role="status" aria-live="polite"><strong>لحظة</strong><i aria-hidden="true"></i><span>جارٍ فتح التطبيق...</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

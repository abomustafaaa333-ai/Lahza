<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">شعار لحظة الرئيسي</title>
  <desc id="desc">رمز موقع جغرافي وساعة مع كلمة لحظة بخط عربي هندسي</desc>
  <defs>
    <style>
      .wordmark { font-family: 'Tajawal', 'Noto Kufi Arabic', Arial, sans-serif; font-size: 170px; font-weight: 800; letter-spacing: 0; }
    </style>
  </defs>
  <!-- All elements are separate and editable -->
  <g id="wordmark" fill="#00666B">
    <text class="wordmark" x="720" y="265" direction="rtl" unicode-bidi="bidi-override">لحظة</text>
  </g>
  <g id="speed-accent" fill="#FF6B2B">
    <rect x="330" y="280" width="116" height="22" rx="11"/>
    <rect x="390" y="320" width="74" height="22" rx="11"/>
  </g>
  <g id="emblem">
    <rect x="875" y="45" width="300" height="300" rx="72" fill="#FF6B2B"/>
    <!-- speed trails -->
    <rect x="915" y="151" width="70" height="22" rx="11" fill="#FFFDF8"/>
    <rect x="901" y="193" width="84" height="22" rx="11" fill="#FFFDF8"/>
    <rect x="930" y="235" width="55" height="22" rx="11" fill="#FFFDF8"/>
    <circle cx="905" cy="274" r="11" fill="#FFFDF8"/>
    <!-- location pin / clock -->
    <path d="M1030 84c-58 0-105 47-105 105 0 78 105 153 105 153s105-75 105-153c0-58-47-105-105-105Z" fill="#FFFDF8"/>
    <circle cx="1030" cy="187" r="61" fill="#FF6B2B"/>
    <circle cx="1030" cy="187" r="10" fill="#00666B"/>
    <path d="M1030 187V145M1030 187l34 22" fill="none" stroke="#00666B" stroke-width="15" stroke-linecap="round"/>
  </g>
</svg>
